<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Botones de navegación en la parte superior -->
  <div class="navigation-container">
    <ion-button fill="clear" class="back-button" routerLink="/first-year">
      <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <div class="profile-button" routerLink="/profile">
      <div class="profile-avatar">
        <ion-icon name="person"></ion-icon>
      </div>
      <div class="profile-name">Alejandro</div>
    </div>
  </div>

  <h1 class="main-title">Apuntes de prácticas</h1>

  <!-- Barra de búsqueda -->
  <div class="search-container">
    <ion-searchbar [(ngModel)]="searchTerm" 
                  (ionInput)="filterNotes()" 
                  placeholder="Buscar apuntes"
                  mode="ios"
                  class="custom-searchbar">
    </ion-searchbar>
  </div>

  <!-- Botón para añadir apuntes -->
  <ion-button expand="block" 
              (click)="addNewNote()" 
              class="add-button">
    <ion-icon name="add" slot="start"></ion-icon>
    Añadir apuntes
  </ion-button>

  <!-- Lista de apuntes -->
  <h2 class="section-title">Apuntes subidos</h2>
  
  <div class="notes-container">
    <div class="note-card" *ngFor="let note of filteredNotes">
      <div class="note-tag">{{ note.subjectId }}</div>
      
      <div class="note-content">
        <h3 class="note-title">{{ note.title }}</h3>
        <p class="note-description">{{ note.description }}</p>
      </div>
      
      <div class="note-footer">
        <span class="note-date">{{ note.date | date: 'dd/MM/yyyy' }}</span>
        <ion-icon [name]="isNoteFavorite(note.id) ? 'heart' : 'heart-outline'" 
                [class.favorite]="isNoteFavorite(note.id)"
                (click)="toggleFavorite(note)" 
                class="favorite-icon">
        </ion-icon>
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay apuntes -->
  <div *ngIf="filteredNotes.length === 0" class="empty-state">
    <ion-icon name="document-text-outline"></ion-icon>
    <p>No hay apuntes disponibles</p>
  </div>
</ion-content>
