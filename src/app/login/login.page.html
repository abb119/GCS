<ion-content class="ion-padding">
  <div class="logo-container">
    <div class="graduation-icon">
      <svg width="70" height="70" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M45 20L25 10L5 20L25 30L45 20ZM45 20V30" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25V35C15 36.3261 16.0536 37.5979 18.0481 38.5355C20.0426 39.4732 22.4587 40 25 40C27.5413 40 29.9574 39.4732 31.9519 38.5355C33.9464 37.5979 35 36.3261 35 35V25" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M45 30C45 30 41 35 45 40" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="app-name">NODO</h1>
  </div>

  <div class="login-form">
    <h1 class="login-title">Log In</h1>
    
    <div class="form-field">
      <ion-label>Email</ion-label>
      <ion-item class="custom-input">
        <ion-input type="email" [(ngModel)]="email" (ionChange)="validateEmail()" placeholder=""></ion-input>
        <ion-icon *ngIf="email && isValidEmail" name="checkmark-circle" slot="end" class="valid-icon"></ion-icon>
        <ion-icon *ngIf="email && !isValidEmail" name="close-circle" slot="end" class="invalid-icon"></ion-icon>
      </ion-item>
    </div>

    <div class="form-field">
      <ion-label>Contraseña</ion-label>
      <ion-item class="custom-input">
        <ion-input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password"></ion-input>
        <ion-icon (click)="togglePasswordVisibility()" [name]="!showPassword ? 'eye-off' : 'eye'" slot="end" class="password-toggle"></ion-icon>
      </ion-item>
      <div class="forgot-password">
        <ion-button fill="clear" size="small" class="forgot-password-button" (click)="forgotPassword()">
          Contraseña olvidada?
        </ion-button>
      </div>
    </div>

    <ion-button expand="block" class="login-button" [disabled]="!isValidEmail || !email || !password" 
                [ngClass]="{'disabled': !isValidEmail || !email || !password}" (click)="doLogin()">
      Log in
    </ion-button>

    <div class="register-prompt">
      <span>¿No tienes una cuenta?</span>
      <ion-button fill="clear" class="register-button" (click)="goToRegister()">
        Regístrate
      </ion-button>
    </div>
  </div>
</ion-content>
