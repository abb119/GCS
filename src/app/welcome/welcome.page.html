<ion-content class="ion-padding">
  <div class="logo-container">
    <div class="graduation-icon">
      <svg width="100" height="100" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M45 20L25 10L5 20L25 30L45 20ZM45 20V30" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25V35C15 36.3261 16.0536 37.5979 18.0481 38.5355C20.0426 39.4732 22.4587 40 25 40C27.5413 40 29.9574 39.4732 31.9519 38.5355C33.9464 37.5979 35 36.3261 35 35V25" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M45 30C45 30 41 35 45 40" stroke="#C016F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="app-name">NODO</h1>
  </div>

  <div class="welcome-text">
    <h2>Explora la app</h2>
    <p>Encuentra los documentos que necesitas y sube los tuyos. Ayuda mutua.</p>
  </div>

  <div class="buttons-container">
    <ion-button expand="block" class="login-button" (click)="login()">
      Log In
    </ion-button>
    <ion-button expand="block" fill="outline" class="register-button" (click)="register()">
      Crear cuenta
    </ion-button>
  </div>
</ion-content>
